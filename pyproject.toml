[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ct-mae"
version = "0.1.0"
description = "Label-efficient organ classification with asymmetric masked autoencoders"
readme = "README.md"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE", "licenses/*", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "pillow>=11,<13", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
train = ["torch>=2.6,<3", "torchvision>=0.21,<1", "wandb>=0.19,<1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "playwright>=1.52"]

[tool.hatch.build.targets.wheel]
packages = ["src/ct_mae"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
