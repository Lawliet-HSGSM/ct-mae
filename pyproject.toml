[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ct-mae"
version = "0.1.0"
description = "Inspect OrganAMNIST before designing a medical CT masked autoencoder"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2,<3", "pillow>=11,<13", "matplotlib>=3.9,<4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "playwright>=1.52"]

[tool.hatch.build.targets.wheel]
packages = ["src/ct_mae"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
